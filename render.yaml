services:
  - type: web
    name: cafgic-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build && npx ts-node prisma/seed.ts
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://gemmagf.github.io
      - key: PORT
        value: 10000
