name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Backend · prisma generate + typecheck
        run: npm run prisma:generate --workspace=backend && npm run lint --workspace=backend
      - name: Frontend · typecheck + build
        run: npm run lint --workspace=frontend && npm run build --workspace=frontend
      - name: Frontend · demo build
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
        run: npm run build
      - name: Locale files · same key set
        run: node scripts/check-locales.mjs
